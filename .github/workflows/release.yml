# Moves the floating major tag (v1) to the newly published release, so users
# who pinned @v1 pick up patches automatically.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move major tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          MAJOR="${TAG%%.*}"
          echo "Moving $MAJOR -> $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
