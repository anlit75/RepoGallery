name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # action.yml installs requirements.txt with pip, so users never need uv.
      # That file is generated from uv.lock and must not drift from it.
      - name: requirements.txt is in sync with uv.lock
        run: |
          uv export --no-dev --no-emit-project --quiet > /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt

      - run: uv run --locked --dev pytest -q
