[project]
name = "repogallery"
version = "2.0.1"
description = "Build a static gallery page from your GitHub repositories."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "requests~=2.32",
    "jinja2~=3.1",
    "PyYAML~=6.0",
]

[dependency-groups]
dev = [
    "pytest~=8.0",
]

[tool.uv]
# The generator is run as a script by action.yml, not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
